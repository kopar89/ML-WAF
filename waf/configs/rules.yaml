    score: 0.85

  - name: "CSPBypass_Meta"
    description: "Detect meta http-equiv CSP bypass"
    severity: "HIGH"
    expression: "request.url.matches('(?i)<meta\\s+http-equiv=[\"\\']*refresh[\"\\']')"
    action: "BLOCK"
