  # =======================================================
  # WEB SHELL DETECTION
  # =======================================================
  - name: "WebShell_Common"
    description: "Detect common web shell patterns"
    severity: "CRITICAL"
    expression: "request.query.matches('(?i)(cmd\\s*=|c\\s*=|exec\\s*=|shell\\s*=|command\\s*=|q\\s*=|v\\s*=|x\\s*=|_\\s*=|0\\s*=)')"
