  # =======================================================
  - name: "Monitor_HighEntropy"
    description: "Detect high entropy queries (potential obfuscation)"
    severity: "MEDIUM"
    expression: "request.url.size() > 200 && request.query.matches('(?i)[a-zA-Z0-9+/]{50,}')"
    action: "MONITOR"
    score: 0.3

  - name: "Monitor_SQLKeywords"
    description: "Detect SQL keywords for monitoring"
    severity: "LOW"
