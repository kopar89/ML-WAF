  # BOT / AUTOMATED ATTACKS
  # =======================================================
  - name: "Bot_Scraping"
    description: "Detect web scraping patterns"
    severity: "MEDIUM"
    expression: "request.headers['User-Agent'].matches('(?i)(scrapy|curl|wget|python|java|go-http|php|perl|ruby|bot|spider|crawler|scanner)')"
    action: "MONITOR"
