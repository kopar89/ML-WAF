  - name: "CORS_Wildcard"
    description: "Detect CORS wildcard origin"
    severity: "MEDIUM"
    expression: "request.headers['Origin'].matches('(http:\\/\\/|https:\\/\\/|null|\\*)')"
    action: "MONITOR"
    score: 0.3

  # =======================================================
  # SERVER SIDE INCLUDE (SSI) INJECTION
  # =======================================================
  - name: "SSI_Injection"
    description: "Detect SSI injection"
    severity: "HIGH"
    expression: "request.url.matches('(?i)(<!--\\s*#|<!--\\s*include|<!--\\s*echo|<!--\\s*exec|<!--\\s*print)')"
    action: "BLOCK"
    score: 0.9

