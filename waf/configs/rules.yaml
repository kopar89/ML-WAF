  - name: "Bot_Automation"
    description: "Detect automation tool signatures"
    severity: "MEDIUM"
    expression: "request.headers['User-Agent'].matches('(?i)(sqlmap|nmap|nikto|gobuster|dirbuster|hydra|burp|acunetix|nessus|openvas|metasploit)')"
    action: "BLOCK"
    score: 0.7

