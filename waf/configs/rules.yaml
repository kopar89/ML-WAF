  # =======================================================
  # DATA EXFILTRATION
  # =======================================================
  - name: "Exfil_SQLDump"
    description: "Detect SQL dump patterns"
    severity: "HIGH"
    expression: "request.url.matches('(?i)(mysqldump|mysql dump|\\.sql|backup.*\\.gz')"
