    action: "MONITOR"
    score: 0.2

  - name: "Monitor_AdminAction"
    description: "Detect admin actions for audit"
    severity: "LOW"
    expression: "request.url.matches('(?i)(delete|remove|destroy|disable|enable|update|create|add)\\.(json|xml|yaml|yml)')"
